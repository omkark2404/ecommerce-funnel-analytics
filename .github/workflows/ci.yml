name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, run the notebook, check MySQL results
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          # Ephemeral CI-only test database with sample data; not a real secret.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecommerce_analytics
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PWD: root
      PYTHONPATH: ${{ github.workspace }}
    steps:
      # Actions are pinned to full commit SHAs (with the major
      # version in a comment), so a compromised or re-pointed tag
      # cannot change what runs here. Dependabot updates SHA pins
      # too, so they stay current. SHAs resolved 2026-11-03 from
      # the v7 tags of each action's repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint SQL
        run: python -m sqlfluff lint sql/
      - name: Lint Python
        run: python -m ruff check src tests scripts
      - name: Check Python formatting
        run: python -m ruff format --check src tests scripts
      - name: Run unit tests
        # Includes the MySQL integration tests in
        # tests/test_sql_mysql.py, which run when MYSQL_PWD is set
        # (it is, in this job) and are skipped otherwise.
        run: python -m pytest tests/ -v
      - name: Run the notebook
        run: python -m nbconvert --to notebook --execute notebooks/funnel_analysis.ipynb --output-dir "$RUNNER_TEMP"
      - name: Check committed result CSVs and figure manifest are current
        # The notebook run above regenerates outputs/*.csv and
        # outputs/figures/manifest.json in place; if the committed
        # files differ, the notebook was not re-run after a change.
        # Figures themselves are not diffed (PNG bytes vary across
        # matplotlib versions) — their freshness is checked by the
        # manifest in the next step instead.
        run: git diff --exit-code -- 'outputs/*.csv' 'outputs/figures/manifest.json'
      - name: Check chart figures are valid and current
        # Fully decodes each PNG and checks the manifest's data hash
        # against the current outputs/*.csv, so stale figures fail.
        # See scripts/check_figures.py.
        run: python scripts/check_figures.py
      - name: Copy CSV inputs into MySQL service
        run: |
          docker cp data/product_users_clean.csv ${{ job.services.mysql.id }}:/var/lib/mysql-files/
          docker cp data/product_events_clean.csv ${{ job.services.mysql.id }}:/var/lib/mysql-files/
      - name: Create schema and load data
        run: |
          mysql --host 127.0.0.1 --user root ecommerce_analytics < sql/00_schema.sql
          mysql --host 127.0.0.1 --user root ecommerce_analytics < sql/01_load_data.sql
      - name: Check MySQL results match pandas
        run: python scripts/validate_results.py --mode host
